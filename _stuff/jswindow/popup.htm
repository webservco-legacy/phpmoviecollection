<HTML>
<HEAD>
<TITLE>popup</TITLE>
<SCRIPT TYPE="text/javascript" LANGUAGE="JavaScript">
function loadProgram(url,pname,wd,ht,sx,sy) {
    window.open(url,pname,'width='+wd+',height='+ht+',screenX='+sx+',screenY='+sy+',left='+sx+',top='+sy+',resizable=no,scrollbars=no,toolbar=no,location=no,directories=no,status=no,menubar=no,copyhistory=no');
}
function closeProgram() {
  window.close();
  if (window.opener && !window.opener.closed) {
    window.opener.location.reload();
  } 
}
</SCRIPT>
</HEAD>
<BODY>
<A HREF="Javascript:loadProgram('popup2.htm','popyyy','150','150','450','450');">loadProgram 2</A>
<BR>
<A HREF="Javascript:closeProgram();">close and refresh</A>
</BODY>
</HTML>
